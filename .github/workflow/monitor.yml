name: flight-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # мониторинг цен (команды бота забирает tg-live-poll)
    - cron: "0 * * * *"      # персональные дайджесты пользователей (ежечасно)
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor | udigest (bot — через poll.yml)"
        default: "monitor"
        type: string

# prices.db коммитится обратно в репозиторий
permissions:
  contents: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determine mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "0 * * * *" ]]; then
            echo "MODE=udigest" >> "$GITHUB_ENV"
          else
            echo "MODE=monitor" >> "$GITHUB_ENV"
          fi

      - name: Run monitor
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          HC_URL: ${{ secrets.HC_URL }}
          DB_KEY: ${{ secrets.DB_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          # Команды бота непрерывно забирает workflow tg-live-poll (poll.yml).
          # Telegram запрещает два одновременных getUpdates-клиента (409),
          # поэтому здесь поллинг выключен. Отключили poll.yml? Удалите
          # эту строку — тогда monitor снова будет забирать команды сам.
          SKIP_TG_POLL: "1"
        run: python -m src.main --mode "$MODE"

      - name: Commit price history
        if: env.NEED_COMMIT == '1'
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.db
          if git diff --cached --quiet; then
            echo "No DB changes"
            exit 0
          fi
          git commit -m "chore: price history update [skip ci]"
          # Remote мог уйти вперёд (правки через веб-интерфейс, соседний
          # прогон) — подтягиваем чужие коммиты и ставим наш поверх;
          # при конфликте бинарной prices.db побеждает свежая версия
          # с раннера.
          for i in 1 2 3; do
            if git push; then
              echo "prices.db отправлен (попытка $i)"
              exit 0
            fi
            echo "push отклонён — подтягиваю remote (попытка $i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs prices.db 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::prices.db не отправлен: remote продолжает уходить вперёд"
          exit 1
