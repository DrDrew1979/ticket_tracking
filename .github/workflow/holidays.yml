name: holidays-update

# Производственный календарь РФ (data/holidays.json) — обновление
# раз в ~90 дней (1 января, 1 апреля, 1 июля, 1 октября) из isdayoff.ru.
# Можно запустить вручную: Run workflow.
on:
  schedule:
    - cron: "0 3 1 1,4,7,10 *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holidays-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Зависимостей у режима holidays нет (urllib из стандартной библиотеки)
      - name: Refresh production calendar
        run: python -m src.main --mode holidays

      - name: Commit calendar
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/holidays.json
          if git diff --cached --quiet; then
            echo "Calendar unchanged"
            exit 0
          fi
          git commit -m "chore: production calendar update [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "holidays.json отправлен (попытка $i)"
              exit 0
            fi
            echo "push отклонён — подтягиваю remote (попытка $i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs data/holidays.json 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::holidays.json не отправлен"
          exit 1
