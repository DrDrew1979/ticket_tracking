name: flight-monitor

on:
  schedule:
    - cron: "*/30 * * * *"   # мониторинг каждые 30 минут
    - cron: "0 6 * * *"      # ежедневный дайджест: 06:00 UTC = 09:00 МСК
  workflow_dispatch:
    inputs:
      mode:
        description: "monitor | digest"
        default: "monitor"
        type: string

# prices.db коммитится обратно в репозиторий
permissions:
  contents: write

concurrency:
  group: flight-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Determine mode
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "MODE=${{ inputs.mode }}" >> "$GITHUB_ENV"
          elif [[ "${{ github.event.schedule }}" == "0 6 * * *" ]]; then
            echo "MODE=digest" >> "$GITHUB_ENV"
          else
            echo "MODE=monitor" >> "$GITHUB_ENV"
          fi

      - name: Run monitor
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python -m src.main --mode "$MODE"

      - name: Commit price history
        if: env.NEED_COMMIT == '1'
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.db
          if git diff --cached --quiet; then
            echo "No DB changes"
          else
            git commit -m "chore: price history update [skip ci]"
            git push
          fi
