name: tg-live-poll

# ─────────────────────────────────────────────────────────────────────────────
# «Мгновенные» ответы бота: НЕПРЕРЫВНЫЙ Telegram long polling.
#
# ПОЧЕМУ ПРОЦЕСС ЖИВЁТ ~5,5 ЧАСОВ, А НЕ 4 МИНУТЫ
# Раньше процесс жил 4 минуты и перезапускался cron-ом каждые 5 минут.
# Но cron у GitHub — «best effort»: плановые запуски регулярно опаздывают
# на несколько минут, а в часы пик — на 10–15 минут или вовсе
# пропускаются. В эти паузы поллингом не занимался НИКТО, и бот «замер»
# посреди диалога сразу после «успешного завершения» прогона.
# Теперь один прогон держит long polling 5,5 часа (BOT_LIVE_SECONDS=19800),
# а cron */5 нужен только чтобы:
#   1) держать в очереди свежего «сменщика»;
#   2) поднять нового поллера в течение ≤5 минут, если текущий упал.
#
# КАК ПРОИСХОДИТ СМЕНА ПОЛЛЕРА (concurrency, cancel-in-progress: false)
# - Активный прогон НИКОГДА не прерывается: он сам завершается на 330-й
#   минуте — задолго до жёсткого лимита GitHub (360 мин = 6 ч на джоб).
# - Новые cron-запуски при активном прогоне не стартуют параллельно,
#   а ОБНОВЛЯЮТ очередь: GitHub держит один «отложенный» запуск на
#   группу конкаррентности, и в момент завершения активного прогона
#   он стартует за секунды.
# - Два getUpdates-клиента не встречаются → конфликт 409 невозможен.
# Слепое окно — только ~1–2 минуты старта нового раннера раз в 5,5 ч
# (апдейты за это время Telegram хранит и отдаёт сразу после старта;
# ничего не теряется и не дублируется).
#
# МИНУТЫ ACTIONS: в ПУБЛИЧНОМ репозитории бесплатны (24/7 ≈ 720 ч/мес
# на один одновременный джоб). Для ПРИВАТНОГО репозитория верните
# старый ритм: BOT_LIVE_SECONDS: "240" и timeout-minutes: 8.
#
# Ручной «Run workflow» при активном прогоне встанет в очередь (начнётся
# после его завершения) — обычно это и не нужно: пока прогон активен,
# бот и так отвечает мгновенно. Если бот молчит (последний прогон упал),
# очередь пуста и ручной запуск поднимет поллера немедленно.
# ─────────────────────────────────────────────────────────────────────────────

on:
  schedule:
    - cron: "*/5 * * * *"   # не «перезапуск раз в 5 минут», а сменщик/страховка (см. шапку)
  workflow_dispatch: {}

# prices.db коммитится обратно (состояние диалогов + tg_offset)
permissions:
  contents: write

concurrency:
  group: tg-live
  cancel-in-progress: false   # активный поллер не гасим — он сам уступит сменщику

jobs:
  poll:
    runs-on: ubuntu-latest
    # 350 < жёсткого лимита GitHub (360 мин на джоб). Процесс завершается
    # сам на 330-й минуте; остаток — запас на установку зависимостей
    # и финальный коммит.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      # Страховка для длинного прогона: обрывать git-передачу, если
      # скорость упала ниже 1 КБ/с дольше 30 секунд. Без этого зависший
      # git push/fetch внутри _commit_db мог бы замереть на часы
      # (subprocess в main.py вызывается без таймаута).
      - name: Git stall guard
        run: |
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 30

      - name: Live poll (long polling ~5,5 ч)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DB_KEY: ${{ secrets.DB_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          # 19800 с = 330 мин. Выше ~20400 поднимать НЕЛЬЗЯ:
          # у GitHub жёсткий лимит 6 ч на джоб (убьёт процесс без коммита).
          BOT_LIVE_SECONDS: "19800"
        run: python -m src.main --mode bot

      # Страховка: внутри цикла _commit_db уже пушит после каждой пачки;
      # этот шаг повторяет попытку на уровне workflow, если push не прошёл.
      - name: Commit user state
        if: env.NEED_COMMIT == '1'
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.db
          if git diff --cached --quiet; then
            echo "No DB changes"
            exit 0
          fi
          git commit -m "chore: dialog state update [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "prices.db отправлен (попытка $i)"
              exit 0
            fi
            echo "push отклонён — подтягиваю remote (попытка $i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs prices.db 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::prices.db не отправлен: remote продолжает уходить вперёд"
          exit 1
