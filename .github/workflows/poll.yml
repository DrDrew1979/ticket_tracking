name: tg-live-poll

# «Мгновенные» ответы бота: непрерывный Telegram long polling внутри
# прогона. Actions не умеет cron чаще раза в 5 минут, поэтому процесс
# живёт ~4 минуты (BOT_LIVE_SECONDS) и перезапускается новым cron-запуском;
# соседний инстанс гасится concurrency cancel-in-progress.
# Ответ на сообщение — 1–3 секунды; единственная пауза — ~30-секундный
# старт нового раннера раз в 5 минут (апдейты за это время Telegram
# хранит и отдаёт при следующем long poll).
# В публичном репозитории минуты Actions бесплатны.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# prices.db коммитится обратно (состояние диалогов + tg_offset)
permissions:
  contents: write

concurrency:
  group: tg-live
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Live poll (long polling ~4 min)
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          DB_KEY: ${{ secrets.DB_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          BOT_LIVE_SECONDS: "240"
        run: python -m src.main --mode bot

      # Страховка: внутри цикла _commit_db уже пушит после каждой пачки;
      # этот шаг повторяет попытку на уровне workflow, если push не прошёл.
      - name: Commit user state
        if: env.NEED_COMMIT == '1'
        run: |
          git config user.name "flight-monitor-bot"
          git config user.email "actions@users.noreply.github.com"
          git add prices.db
          if git diff --cached --quiet; then
            echo "No DB changes"
            exit 0
          fi
          git commit -m "chore: dialog state update [skip ci]"
          for i in 1 2 3; do
            if git push; then
              echo "prices.db отправлен (попытка $i)"
              exit 0
            fi
            echo "push отклонён — подтягиваю remote (попытка $i/3)"
            git fetch origin main
            if ! git rebase origin/main; then
              git checkout --theirs prices.db 2>/dev/null || true
              GIT_EDITOR=true git rebase --continue 2>/dev/null || true
            fi
            sleep 5
          done
          echo "::error::prices.db не отправлен: remote продолжает уходить вперёд"
          exit 1
