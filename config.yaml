# ============================================================
# Глобальная конфигурация Telegram-бота мониторинга авиабилетов.
#
# Персональные параметры (маршрут, даты, целевая цена, расписание
# дайджестов) каждый пользователь задаёт САМ командой /watch в
# Telegram. Здесь — только общие настройки и параметры нагрузки.
# ============================================================

carry_on_only: true      # искать тарифы только с ручной кладью (без багажа)
currency: rub            # валюта цен

marker: ""               # ваш партнёрский маркер Travelpayouts (необязательно,
                         # для кэшбэка по собственным ссылкам), например "123456"

monitor:
  history_days_for_min: 30   # окно "минимальной цены" для главного триггера
                             # (алерт: цена <= минимум за N дней)
  alert_improvement_pct: 0.5 # повторить алерт той же пары, если цена упала
                             # ещё на >= N% от цены последнего алерта

# Внешний «маячок» живости (healthchecks.io или совместимый сервис).
# Бот пингует URL при каждом успешном запуске; при падении шлёт /fail;
# если пинги пропали (мониторинг завершён или бот умер) — сервис пришлёт
# вам уведомление по его настройкам.
healthcheck:
  enabled: true
  url: ""                 # ping-URL из healthchecks.io (https://hc-ping.com/<uuid>);
                          # можно вместо этого задать секретом HC_URL —
                          # секрет имеет приоритет
  timeout_seconds: 10

# ---------------------------------------------------------------
# Многопользовательский режим (семейно-дружеский бот в Telegram).
# Требует секретов: DB_KEY (Fernet-ключ шифрования персональных
# данных) и ADMIN_CHAT_ID (chat_id администратора).
# Без DB_KEY режим отключается — бот не принимает команды.
# ---------------------------------------------------------------
multiuser:
  enabled: true
  max_active: 39            # максимум АКТИВНЫХ трекингов обычных пользователей
                            # (слот администратора — всегда есть, вне лимита;
                            # админ настраивает свой трекинг через /watch)
  user_min_interval_min: 60 # пользователи опрашиваются не чаще раза в час
                            # (админ — каждый прогон, каждые 30 мин)
  pairs_budget_per_run: 200 # жёсткий потолок пар-проверок пользователей
                            # за один прогон (защита от перегрузки API)
  warmup_days: 2            # у нового трекинга первые 2 дня алерты цены выключены
  alert_dedup_hours: 12     # повторный алерт той же пары не чаще раза в 12 ч
  retention_days: 45        # наблюдения старше N дней удаляются из базы
                            # (нужно только 30-дневное окно для min30)
