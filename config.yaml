# ============================================================
# Конфигурация мониторинга авиабилетов Москва <-> Горно-Алтайск
# ============================================================

route:
  origin: MOW            # Москва (все аэропорты)
  destination: OGK       # Горно-Алтайск

outbound_window:         # вылет ИЗ Москвы (время местное, как в билете)
  date_from: "2027-07-16"
  time_from: "20:00"
  date_to: "2027-07-18"
  time_to: "23:59"

return_window:           # вылет ИЗ Горно-Алтайска (время местное)
  date_from: "2027-07-31"
  time_from: "00:01"
  date_to: "2027-08-01"
  time_to: "23:59"

price_target_rub: 45000  # целевая цена, RUB, за 1 человека, туда-обратно
max_transfers: null      # ограничений по пересадкам нет (можно указать, напр. 1)
max_duration_hours: null # ограничение по длительности перелёта (напр. 9)
carry_on_only: true      # только ручная кладь (см. README, раздел "Ручная кладь")
currency: rub

marker: ""               # ваш партнёрский маркер Travelpayouts (необязательно,
                         # для кэшбэка по собственным ссылкам), например "123456"

monitor:
  history_days_for_min: 30   # окно "минимальной цены" для главного триггера
  warmup_days: 2             # первые N дней наблюдений алерты цены выключены
                             # (нужно собрать базу, иначе алерт сработает сразу)
  alert_dedup_hours: 12      # не повторять одинаковый алерт чаще, чем раз в N часов
  alert_improvement_pct: 0.5 # ...но повторить, если цена упала ещё на >= N% от
                             # цены последнего алерта
  pairs_per_run: null        # УМНЫЙ РЕЖИМ. null = опрашивать все пары дат за
                             # каждый запуск (достаточно при текущих окнах).
                             # Число = не более N пар за запуск, остальные
                             # проверяются по кругу (ротация, см. README).
                             # Включите, только если сильно расширите окна дат:
                             # напр. 6 при 35 парах => нагрузка как сегодня.
  digest_hour_utc: 6         # час ежедневного дайджеста по UTC (6 UTC = 09:00 МСК)

cutoff:
  weeks_before_departure: 6  # статическая дата отсечки: за N недель до вылета
                             # покупать обязательно (эвристика для летних
                             # российских маршрутов; пересчитывается в дайджесте)
  urgent_days_left: 14       # за сколько дней до отсечки считать режим "срочный"

# Авто-остановка мониторинга после дат вылетов.
# Дата остановки ВЫЧИСЛЯЕТСЯ из конфига: при смене окон дат выше она
# сдвигается автоматически, а остановившийся бот сам возобновляет работу.
stop:
  mode: auto              # auto = последняя дата return_window + grace_days;
                          # manual = взять дату из stop_date ниже
  grace_days: 3           # при mode: auto — столько дней после последнего
                          # возврата бот ещё следит (вдруг дата сдвинется)
  stop_date: "2027-08-05" # используется только при mode: manual

# Внешний «маячок» живости (healthchecks.io или совместимый сервис).
# Бот пингует URL при каждом успешном запуске; при падении шлёт /fail;
# если пинги пропали (мониторинг завершён или бот умер) — сервис пришлёт
# вам уведомление по его настройкам.
healthcheck:
  enabled: true
  url: ""                 # ping-URL из healthchecks.io (https://hc-ping.com/<uuid>);
                          # можно вместо этого задать секретом HC_URL —
                          # секрет имеет приоритет
  timeout_seconds: 10

# ---------------------------------------------------------------
# Многопользовательский режим (семейно-дружеский бот в Telegram).
# Требует секретов: DB_KEY (Fernet-ключ шифрования персональных
# данных) и ADMIN_CHAT_ID (chat_id администратора).
# Без DB_KEY режим отключается, личный мониторинг работает как раньше.
# ---------------------------------------------------------------
multiuser:
  enabled: true
  max_active: 39            # максимум АКТИВНЫХ трекингов обычных пользователей
                            # (слот администратора — всегда есть, вне лимита)
  user_min_interval_min: 60 # пользователи опрашиваются не чаще раза в час
                            # (владелец — каждый прогон, каждые 30 мин)
  pairs_budget_per_run: 200 # жёсткий потолок пар-проверок пользователей
                            # за один прогон (защита от перегрузки API)
  warmup_days: 2            # у нового трекинга первые 2 дня алерты цены выключены
  alert_dedup_hours: 12     # повторный алерт той же пары не чаще раза в 12 ч
  retention_days: 45        # наблюдения старше N дней удаляются из базы
                            # (нужен только 30-дневный окно для min30)
