# ============================================================
# Конфигурация мониторинга авиабилетов Москва <-> Горно-Алтайск
# ============================================================

route:
  origin: MOW            # Москва (все аэропорты)
  destination: OGK       # Горно-Алтайск

outbound_window:         # вылет ИЗ Москвы (время местное, как в билете)
  date_from: "2027-07-16"
  time_from: "20:00"
  date_to: "2027-07-18"
  time_to: "23:59"

return_window:           # вылет ИЗ Горно-Алтайска (время местное)
  date_from: "2027-07-31"
  time_from: "00:01"
  date_to: "2027-08-01"
  time_to: "23:59"

price_target_rub: 45000  # целевая цена, RUB, за 1 человека, туда-обратно
max_transfers: null      # ограничений по пересадкам нет (можно указать, напр. 1)
max_duration_hours: null # ограничение по длительности перелёта (напр. 9)
carry_on_only: true      # только ручная кладь (см. README, раздел "Ручная кладь")
currency: rub

marker: ""               # ваш партнёрский маркер Travelpayouts (необязательно,
                         # для кэшбэка по собственным ссылкам), например "123456"

monitor:
  history_days_for_min: 30   # окно "минимальной цены" для главного триггера
  warmup_days: 2             # первые N дней наблюдений алерты цены выключены
                             # (нужно собрать базу, иначе алерт сработает сразу)
  alert_dedup_hours: 12      # не повторять одинаковый алерт чаще, чем раз в N часов
  alert_improvement_pct: 0.5 # ...но повторить, если цена упала ещё на >= N% от
                             # цены последнего алерта
  digest_hour_utc: 6         # час ежедневного дайджеста по UTC (6 UTC = 09:00 МСК)

cutoff:
  weeks_before_departure: 6  # статическая дата отсечки: за N недель до вылета
                             # покупать обязательно (эвристика для летних
                             # российских маршрутов; пересчитывается в дайджесте)
  urgent_days_left: 14       # за сколько дней до отсечки считать режим "срочный"
